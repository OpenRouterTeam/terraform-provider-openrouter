name: CI

# Offline PR gate: build, static checks and every test that needs no
# credentials (unit tests plus the httptest-backed stub acceptance tests in
# internal/acceptance). Live acceptance tests skip here because TF_ACC is
# unset; they run in acceptance.yaml (nightly, dispatch, and every same-repo
# PR after its regeneration) and as the release gate in sdk_publish.yaml.
#
# Bot PRs (spec updates and Speakeasy regen PRs) are opened by the
# GH_DOCS_SYNC app, so this runs on them, and auto-merge-bot-prs.yaml waits
# for it before merging.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

# A new PR revision cancels the older run. Pushes and dispatches get a group
# per run, so every main commit is checked: a shared group would let a newer
# queued run replace an older pending one.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # .speakeasy regeneration owns go.mod, so CI alone enforces the Go floor.
      - name: Enforce minimum Go version (1.26.10)
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import sys

          match = re.search(r'^go[ \t]+(\d+)\.(\d+)(?:\.(\d+))?[ \t]*$', pathlib.Path('go.mod').read_text(), re.M)
          if not match or tuple(int(part or 0) for part in match.groups()) < (1, 26, 10):
              sys.exit('go.mod must declare Go 1.26.10 or newer')
          PY

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # The stub acceptance tests drive a real Terraform CLI against httptest
      # servers.
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Build
        run: go build ./...

      - name: Check provider binary for known vulnerabilities
        continue-on-error: true
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/terraform-provider-openrouter" .
          # Exit 3 means vulnerabilities were found; anything else is a tool error.
          rc=0
          govulncheck -mode=binary "$RUNNER_TEMP/terraform-provider-openrouter" || rc=$?
          if [ "$rc" -eq 3 ]; then
            echo "::error::govulncheck found a reachable known vulnerability (see 'Fixed in' above). Fix: raise the go directive in go.mod to the fixed Go release, or go get <module>@<fixed version> and raise its minimum in .speakeasy/gen.yaml additionalDependencies; then go mod tidy and open a PR."
          fi
          exit "$rc"

      - name: go mod tidy
        run: go mod tidy -diff

      # Skip the generated SDK client (internal/sdk): its vet findings are
      # Speakeasy output we cannot fix here. Generated provider code outside
      # it is checked, so a regen that breaks gofmt/vet fails on main.
      - name: gofmt
        run: |
          unformatted=$(git ls-files '*.go' | grep -v '^internal/sdk/' | xargs gofmt -l)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go list ./... | grep -v /internal/sdk | xargs go vet

      - name: Test (live acceptance skipped without TF_ACC)
        run: go test ./... -timeout 15m

  config:
    name: Lint config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfLo "$RUNNER_TEMP/$archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: terraform fmt (examples)
        run: terraform fmt -check -recursive -diff examples

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: goreleaser check
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: check

  generated-code:
    name: Generated code pairing
    # Pull requests only: it compares the branch against its base. A push to
    # main has no base to compare and the regen PR that produced it already ran
    # this check.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The check diffs the branch against its base commit, so the history
          # has to be there.
          fetch-depth: 0

      # Custom code only survives if a regeneration observes it, and
      # regenerate.yaml is path-filtered to .speakeasy/**. A PR that edits
      # generated Go alone never runs the generator, so its edit is never
      # validated and the breakage lands on whatever PR regenerates next.
      - name: Generated Go must come with a generator input
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 .github/scripts/check_generated_pairing.py "$BASE_SHA" HEAD
