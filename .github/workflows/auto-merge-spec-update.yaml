name: Auto-merge spec update

# Merges the OpenAPI spec PRs that the monorepo SDK-release flow
# (openrouter-web sdk-release-prs.yaml) opens with the GH_DOCS_SYNC app. That
# flow only enables GitHub auto-merge, which waits for the approval the main
# ruleset requires, so each spec PR sat open until the next release closed it
# as superseded. regenerate.yaml commits the generated provider to the PR;
# once Regenerate and CI pass, this job merges through the REST endpoint,
# which honors the app's ruleset bypass. The merge ships a release through
# sdk_publish.yaml.
#
# Only commits the app pushed are merged: the job runs on events the app sent,
# every push to the branch must be the app's (the monorepo's spec commit and
# Regenerate's commit), and the merge pins the event's head SHA, so a later
# push makes it fail. The PR must update .speakeasy/in.openapi.yaml and may not
# touch .github/.

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: auto-merge-spec-update-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  merge:
    if: >-
      github.event.sender.login == 'openrouter-docs-sync[bot]'
      && github.event.pull_request.user.login == 'openrouter-docs-sync[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository
      && startsWith(github.event.pull_request.head.ref, 'sdk-bot/openapi-update-')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PR_NUM: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.GH_DOCS_SYNC_APP_ID }}
          private-key: ${{ secrets.GH_DOCS_SYNC_APP_PRIVATE_KEY }}

      - name: Check who pushed and what changed
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          OTHERS=$(gh api --paginate "repos/$GITHUB_REPOSITORY/activity?ref=refs/heads/$HEAD_REF" \
            --jq '.[] | select(.actor.login != "openrouter-docs-sync[bot]") | "\(.activity_type) by \(.actor.login)"')
          if [ -n "$OTHERS" ]; then
            echo "::error::$HEAD_REF has updates from outside the app; leaving PR #$PR_NUM for review"
            echo "$OTHERS"
            exit 1
          fi

          FILES=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUM/files" --jq '.[].filename')
          if ! grep -qx '.speakeasy/in.openapi.yaml' <<< "$FILES"; then
            echo "::error::Spec PR #$PR_NUM does not update .speakeasy/in.openapi.yaml; leaving it for review"
            exit 1
          fi
          if grep -q '^\.github/' <<< "$FILES"; then
            echo "::error::Spec PR #$PR_NUM changes .github/; leaving it for review"
            exit 1
          fi

      # Regenerate either pushes a commit, whose synchronize event starts a
      # fresh run of this workflow, or leaves the head alone. It is skipped on
      # the app's own pushes. ci.yaml runs on each head because the app token,
      # unlike GITHUB_TOKEN, triggers pull_request workflows.
      - name: Wait for Regenerate and CI
        id: wait
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 1800))
          for name in "Regenerate" "Build and test" "Lint config"; do
            while :; do
              RESULT=$(gh api -X GET "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/check-runs" \
                -f check_name="$name" \
                --jq '.check_runs | sort_by(.started_at) | last | "\(.status) \(.conclusion)"')
              case "$RESULT" in
                "completed success" | "completed skipped")
                  echo "$name: ${RESULT#completed }"
                  break
                  ;;
                completed*)
                  echo "::error::$name concluded ${RESULT#completed }; leaving PR #$PR_NUM for review"
                  exit 1
                  ;;
              esac
              if [ "$SECONDS" -ge "$deadline" ]; then
                echo "::error::Timed out waiting for $name on $HEAD_SHA"
                exit 1
              fi
              echo "$name: ${RESULT} — waiting 20s..."
              sleep 20
            done

            if [ "$name" = "Regenerate" ]; then
              CURRENT=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUM" --jq .head.sha)
              if [ "$CURRENT" != "$HEAD_SHA" ]; then
                echo "Head moved to $CURRENT; the run for that push merges it"
                echo "superseded=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
          done

      - name: Merge spec PR
        if: steps.wait.outputs.superseded != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          STATE=$(gh pr view "$PR_NUM" --repo "$GITHUB_REPOSITORY" --json state --jq .state)
          if [ "$STATE" != "OPEN" ]; then
            echo "PR #$PR_NUM is $STATE (likely superseded) — skipping merge"
            exit 0
          fi

          if ! gh api -X PUT "repos/$GITHUB_REPOSITORY/pulls/$PR_NUM/merge" \
              -f merge_method=squash -f sha="$HEAD_SHA" > /dev/null 2> /tmp/gh-merge.err; then
            cat /tmp/gh-merge.err >&2
            echo "::error::Could not merge spec PR #$PR_NUM. If the error is a rule violation, the GH_DOCS_SYNC app needs bypass on the main rulesets."
            exit 1
          fi
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$HEAD_REF" > /dev/null \
            || echo "::warning::Merged PR #$PR_NUM but could not delete branch $HEAD_REF"

          echo "::notice title=spec-pr-merged::Merged spec PR #$PR_NUM at $HEAD_SHA"
