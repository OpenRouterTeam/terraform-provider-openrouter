name: Regenerate

# Regenerates the provider on pull requests that change Speakeasy inputs (the
# OpenAPI spec, overlays, gen/workflow config, patches) and commits the result
# to the PR branch. CI, the `run-acceptance` label and review then cover the
# generated code before merge, instead of a separate regen PR afterwards.
#
# The commit also carries the release bump (releaseVersion in gen.lock), so
# merging the PR triggers sdk_publish.yaml, and the post-merge Generate
# workflows find nothing to change. Those stay the fallback for fork PRs,
# which get no secrets here, and for Speakeasy generator updates.
#
# Pushes use the GH_DOCS_SYNC app token, because a GITHUB_TOKEN push does not
# trigger CI on the new commit. The app's push fires this workflow again; that
# run is skipped.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
    paths:
      - .speakeasy/**
      - "!.speakeasy/gen.lock"
      - "!.speakeasy/workflow.lock"
      - "!.speakeasy/out.openapi.yaml"

permissions:
  contents: read

concurrency:
  group: regenerate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  regenerate:
    name: Regenerate
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && !(github.event.action == 'synchronize' && github.event.sender.login == 'openrouter-docs-sync[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.GH_DOCS_SYNC_APP_ID }}
          private-key: ${{ secrets.GH_DOCS_SYNC_APP_PRIVATE_KEY }}

      # Check out the branch (not the merge ref) so the result can be pushed.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Confirm the branch has not moved
        id: head
        run: |
          if [ "$(git rev-parse HEAD)" != "$HEAD_SHA" ]; then
            echo "Branch moved past $HEAD_SHA; the run for the newer push regenerates it"
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@v6
        if: steps.head.outputs.stale != 'true'
        with:
          go-version-file: go.mod
          cache: true

      # tfplugindocs (go generate) renders docs from the provider schema
      # through the Terraform CLI.
      - uses: hashicorp/setup-terraform@v3
        if: steps.head.outputs.stale != 'true'
        with:
          terraform_wrapper: false

      # workflow.yaml pins speakeasyVersion; the CLI switches to that version
      # itself when it is not "latest".
      - name: Install Speakeasy CLI
        if: steps.head.outputs.stale != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          gh release download --repo speakeasy-api/speakeasy \
            --pattern speakeasy_linux_amd64.zip --pattern checksums.txt
          grep ' speakeasy_linux_amd64.zip$' checksums.txt | sha256sum -c -
          unzip -q speakeasy_linux_amd64.zip speakeasy -d "$RUNNER_TEMP/speakeasy-bin"
          echo "$RUNNER_TEMP/speakeasy-bin" >> "$GITHUB_PATH"

      # Speakeasy reruns are not idempotent with versioning on: each run bumps
      # releaseVersion again. So generate without versioning first, keep the
      # result only if it changes something besides the Speakeasy config and
      # lock files (the rule sdk-generation-action uses), and regenerate with
      # versioning only when this PR is not already ahead of main's release.
      - name: Generate
        id: generate
        if: steps.head.outputs.stale != 'true'
        env:
          SPEAKEASY_API_KEY: ${{ secrets.SPEAKEASY_API_KEY }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          # Generation may need a newer Go patch release than go.mod names.
          GOTOOLCHAIN: auto
        run: |
          set -euo pipefail

          # Persistent edits fetch the previous pristine snapshot from origin
          # and push the new one (refs/speakeasy/gen/<generation_id>). Put the
          # token in the remote URL so this works whether the CLI shells out
          # to git or uses its own client.
          git remote set-url origin "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          generate() {
            speakeasy run --target open-router --auto-yes --skip-upload-spec --skip-testing --output console "$@"
            go generate ./...
          }
          significant() {
            git status --porcelain -- . \
              ':!.speakeasy/gen.yaml' ':!.speakeasy/gen.lock' \
              ':!.speakeasy/workflow.yaml' ':!.speakeasy/workflow.lock' | grep -q .
          }
          release_version() {
            sed -n 's/^  releaseVersion: //p' | head -1
          }

          generate --skip-versioning
          if ! significant; then
            echo "Regeneration made no significant changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --quiet origin main
          MAIN_VERSION=$(git show origin/main:.speakeasy/gen.lock | release_version)
          PR_VERSION=$(git show HEAD:.speakeasy/gen.lock | release_version)
          HIGHEST=$(printf '%s\n%s\n' "$MAIN_VERSION" "$PR_VERSION" | sort -V | tail -1)
          if [ "$PR_VERSION" = "$MAIN_VERSION" ]; then
            echo "Regenerating with a version bump past $MAIN_VERSION"
            git checkout -- .
            git clean -fdq
            generate
          elif [ "$HIGHEST" = "$MAIN_VERSION" ]; then
            echo "::error::This branch is on release $PR_VERSION but main is on $MAIN_VERSION. Merge main into the branch so the next push regenerates on top of it."
            exit 1
          else
            echo "Branch is already on release $PR_VERSION (main: $MAIN_VERSION); keeping it"
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.generate.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          BOT_ID=$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${BOT_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          git add -A
          VERSION=$(sed -n 's/^  releaseVersion: //p' .speakeasy/gen.lock | head -1)

          # The next generation fetches this snapshot; without it on origin,
          # persistent edits fail. Push it if the CLI did not.
          GEN_REF="refs/speakeasy/gen/$(sed -n 's/^  generation_id: //p' .speakeasy/gen.lock | head -1)"
          if ! git ls-remote --exit-code origin "$GEN_REF" > /dev/null; then
            git push origin "$GEN_REF"
          fi

          git commit --quiet -m "chore: regenerate provider (v$VERSION)"
          git push origin "HEAD:refs/heads/$HEAD_REF"
          {
            echo "## Regenerated"
            echo "Pushed $(git rev-parse --short HEAD) to \`$HEAD_REF\` (release v$VERSION)."
            echo
            echo '```'
            git show --stat --format= HEAD | tail -25
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
