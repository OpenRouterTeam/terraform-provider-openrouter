name: Regenerate

# Regenerates the provider on pull requests that change Speakeasy inputs, so
# CI and review see the generated code before merge. Speakeasy's generation
# action in direct mode does the work: on a pull_request event it generates on
# the PR branch, bumps the release version, commits only when the output
# changed beyond version strings, and never releases or tags. Merging the PR
# then publishes through sdk_publish.yaml (the commit carries gen.lock).
#
# The GH_DOCS_SYNC app token makes the action's push trigger CI. That push
# re-runs this workflow, which finds nothing to change.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
    paths:
      - .speakeasy/**
      - "!.speakeasy/gen.lock"
      - "!.speakeasy/workflow.lock"
      - "!.speakeasy/out.openapi.yaml"

permissions:
  contents: read

jobs:
  regenerate:
    name: Regenerate
    # Fork PRs get no secrets; the post-merge Generate workflows cover them.
    if: github.event.pull_request.head.repo.full_name == github.repository
    concurrency:
      group: regenerate-${{ github.event.pull_request.number }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.GH_DOCS_SYNC_APP_ID }}
          private-key: ${{ secrets.GH_DOCS_SYNC_APP_PRIVATE_KEY }}

      - uses: speakeasy-api/sdk-generation-action@v15
        with:
          action: run-workflow
          mode: direct
          github_access_token: ${{ steps.app-token.outputs.token }}
          speakeasy_api_key: ${{ secrets.SPEAKEASY_API_KEY }}
