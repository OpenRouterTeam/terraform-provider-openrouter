name: Regenerate

# Regenerates the provider on pull requests that change Speakeasy inputs (the
# OpenAPI spec, overlays, gen/workflow config, patches) and commits the result
# to the PR branch, so CI, the `run-acceptance` label and review cover the
# generated code before merge. The first regen commit on a PR also bumps the
# release, so merging publishes through sdk_publish.yaml; the post-merge
# Generate workflows then find nothing to change. Those stay the fallback for
# fork PRs (no secrets here) and Speakeasy generator updates.
#
# speakeasy-api/sdk-generation-action can't do this: in direct mode on a
# pull_request event it fails to check out the PR branch (v15). So this runs
# the CLI and pushes with the GH_DOCS_SYNC app token, whose pushes (unlike
# GITHUB_TOKEN's) trigger CI. That push re-runs this workflow, which finds
# nothing to change.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
    paths:
      - .speakeasy/**
      - "!.speakeasy/gen.lock"
      - "!.speakeasy/workflow.lock"
      - "!.speakeasy/out.openapi.yaml"

permissions:
  contents: read

jobs:
  regenerate:
    name: Regenerate
    if: github.event.pull_request.head.repo.full_name == github.repository
    # Queue rather than cancel: cancelling the run that just pushed would
    # leave a cancelled check on that head.
    concurrency:
      group: regenerate-${{ github.event.pull_request.number }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.GH_DOCS_SYNC_APP_ID }}
          private-key: ${{ secrets.GH_DOCS_SYNC_APP_PRIVATE_KEY }}

      # The event's head commit, not the branch: if the branch moved since,
      # the push below is rejected and the newer push's run takes over.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # go generate renders docs (tfplugindocs) through the Terraform CLI.
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      # workflow.yaml pins speakeasyVersion; the CLI switches to it itself.
      - name: Install Speakeasy CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          gh release download --repo speakeasy-api/speakeasy --pattern speakeasy_linux_amd64.zip --pattern checksums.txt
          grep ' speakeasy_linux_amd64.zip$' checksums.txt | sha256sum -c -
          unzip -q speakeasy_linux_amd64.zip speakeasy -d bin
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # Generating with --skip-versioning is idempotent (a rerun changes only
      # gen.lock), so "anything else changed" is the whole significance test.
      # A branch still on main's release then gets one patch bump, carried into
      # the generated version strings by a second run.
      - name: Generate
        id: generate
        env:
          SPEAKEASY_API_KEY: ${{ secrets.SPEAKEASY_API_KEY }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          # Generation may need a newer Go patch release than go.mod names.
          GOTOOLCHAIN: auto
        run: |
          set -euo pipefail

          # Persistent edits fetch the previous pristine snapshot from origin
          # and push the new one (refs/speakeasy/gen/<generation_id>).
          git remote set-url origin "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          generate() {
            speakeasy run --target open-router --skip-versioning --skip-upload-spec --skip-testing --auto-yes --output console
            go generate ./...
          }
          release() {
            sed -n 's/^  releaseVersion: //p' "$1" | head -1
          }

          generate
          if [ -z "$(git status --porcelain -- . ':!.speakeasy/gen.lock')" ]; then
            echo "Regeneration made no changes"
            exit 0
          fi

          git fetch --quiet origin main
          if [ "$(release .speakeasy/gen.lock)" = "$(git show origin/main:.speakeasy/gen.lock | release /dev/stdin)" ]; then
            speakeasy bump patch
            generate
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.generate.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          # A regen commit on top of this workflow's own regen commit means the
          # output is not stable; stop rather than push in a loop.
          if git log -1 --format=%s | grep -q '^chore: regenerate provider'; then
            echo "::error::Regenerating the previous regen commit changed the output again; generation is not stable"
            exit 1
          fi

          BOT_ID=$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${BOT_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          VERSION=$(sed -n 's/^  releaseVersion: //p' .speakeasy/gen.lock | head -1)
          git add -A
          git commit --quiet -m "chore: regenerate provider (v$VERSION)"
          if ! git push origin "HEAD:refs/heads/$HEAD_REF"; then
            # Only a moved branch is expected; anything else is a real failure.
            [ "$(git ls-remote origin "refs/heads/$HEAD_REF" | cut -f1)" != "$HEAD_SHA" ] || exit 1
            echo "::notice::$HEAD_REF moved past $HEAD_SHA; the run for the newer push regenerates it"
          fi
