name: Generate

# Regenerates the provider on main with Speakeasy's generation action in PR
# mode. The action keeps custom code (persistentEdits), reuses one
# speakeasy-sdk-regen-* branch, and opens or updates its PR; because it runs
# with the GH_DOCS_SYNC app token, that PR is app-authored, so CI and
# Regenerate run on it and auto-merge-bot-prs.yaml merges it once they pass.
#
# Runs nightly (Speakeasy generator updates), on demand, when Speakeasy
# inputs land on main without having been regenerated on their PR (fork PRs,
# whose Regenerate runs get no secrets), and when a regen PR's version label
# changes (patch/minor/major/graduate). A PR regenerated by regenerate.yaml
# leaves nothing to do.

on:
  workflow_dispatch:
    inputs:
      force:
        description: Force generation of SDKs
        type: boolean
        default: false
      set_version:
        description: optionally set a specific SDK version
        type: string
  schedule:
    - cron: 0 0 * * *
  push:
    branches:
      - main
    # Same inputs as regenerate.yaml.
    paths:
      - .speakeasy/**
      - "!.speakeasy/gen.lock"
      - "!.speakeasy/workflow.lock"
      - "!.speakeasy/out.openapi.yaml"
  pull_request:
    types: [labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: speakeasy-generate
  cancel-in-progress: false

jobs:
  generate:
    # Label events matter only for Speakeasy's version labels on its own PRs.
    if: >-
      github.event_name != 'pull_request'
      || (startsWith(github.event.pull_request.head.ref, 'speakeasy-sdk-regen-')
          && contains(fromJSON('["patch","minor","major","graduate","pre-release"]'), github.event.label.name))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.GH_DOCS_SYNC_APP_ID }}
          private-key: ${{ secrets.GH_DOCS_SYNC_APP_PRIVATE_KEY }}

      - uses: speakeasy-api/sdk-generation-action@v15
        with:
          action: run-workflow
          mode: pr
          force: ${{ inputs.force || false }}
          set_version: ${{ inputs.set_version }}
          github_access_token: ${{ steps.app-token.outputs.token }}
          speakeasy_api_key: ${{ secrets.SPEAKEASY_API_KEY }}
