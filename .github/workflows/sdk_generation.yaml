name: Generate

# Regenerates the provider on main and opens a regen PR as the GH_DOCS_SYNC
# app; auto-merge-bot-prs.yaml merges it once Regenerate and CI pass. Runs
# nightly (Speakeasy generator updates), on demand, and when Speakeasy inputs
# land on main without having been regenerated on their PR (fork PRs, whose
# Regenerate runs get no secrets). A PR regenerated by regenerate.yaml leaves
# nothing to do.
#
# Uses the Speakeasy CLI rather than speakeasy-api/sdk-generation-action,
# whose regeneration dropped custom code (persistentEdits) in #626.

on:
  workflow_dispatch:
    inputs:
      set_version:
        description: Optionally release this exact version
        type: string
  schedule:
    - cron: 0 0 * * *
  push:
    branches:
      - main
    paths:
      - .speakeasy/in.openapi.yaml
      - .speakeasy/workflow.yaml
      - .speakeasy/gen.yaml
      - .speakeasy/speakeasy-modifications-overlay.yaml
      - .speakeasy/terraform-entities-overlay.yaml
      - .speakeasy/patches/**

permissions:
  contents: read

concurrency:
  group: speakeasy-generate
  cancel-in-progress: false

jobs:
  generate:
    # A merged regen PR changes gen.yaml too; there is nothing left to do.
    if: >-
      github.event_name != 'push'
      || !startsWith(github.event.head_commit.message, 'chore: regenerate provider')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.GH_DOCS_SYNC_APP_ID }}
          private-key: ${{ secrets.GH_DOCS_SYNC_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Generate
        id: generate
        uses: ./.github/actions/generate-provider
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          speakeasy-api-key: ${{ secrets.SPEAKEASY_API_KEY }}
          release-base: HEAD
          set-version: ${{ inputs.set_version }}
          upload-spec: "true"

      # Opened with the app token so CI runs on the PR, which the auto-merge
      # waits for. Older regen PRs are closed in favor of this one.
      - name: Open the regen PR
        if: steps.generate.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          BOT_ID=$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${BOT_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          VERSION=$(sed -n 's/^  releaseVersion: //p' .speakeasy/gen.lock | head -1)
          BRANCH="speakeasy-sdk-regen-${GITHUB_RUN_ID}"

          git checkout --quiet -b "$BRANCH"
          git add -A
          git commit --quiet -m "chore: regenerate provider (v$VERSION)"
          git push --quiet origin "$BRANCH"
          PR_URL=$(gh pr create --base main --head "$BRANCH" --title "chore: regenerate provider (v$VERSION)" \
            --body "Regenerated by the [Generate workflow run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) with the Speakeasy CLI. Merged automatically once Regenerate and CI pass.")
          echo "::notice title=regen-pr::$PR_URL"

          gh pr list --state open --search "head:speakeasy-sdk-regen-" --json number,headRefName \
            --jq '.[] | select(.headRefName != env.BRANCH and (.headRefName | startswith("speakeasy-sdk-regen-"))) | .number' \
            | xargs -r -I{} gh pr close {} --delete-branch --comment "Superseded by $PR_URL"
