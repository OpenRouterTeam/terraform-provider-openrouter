name: Generate
# Generates the provider on main with Speakeasy's action (mode: pr) and merges
# the regen PR it opens (auto-merge-speakeasy-pr.yaml). Runs nightly (for
# Speakeasy generator updates), on demand, after a PR that changes Speakeasy
# inputs merges, and when a regen PR's version label changes. PRs from this
# repo are already regenerated before merge by regenerate.yaml, so the
# post-merge run normally finds nothing to do; it covers fork PRs.
permissions:
  checks: write
  contents: write
  pull-requests: write
  statuses: write
  id-token: write
"on":
  workflow_dispatch:
    inputs:
      force:
        description: Force generation of SDKs
        type: boolean
        default: false
      set_version:
        description: optionally set a specific SDK version
        type: string
  schedule:
    - cron: 0 0 * * *
  pull_request:
    types: [closed, labeled, unlabeled]
    branches:
      - main
    paths:
      - .speakeasy/in.openapi.yaml
      - .speakeasy/workflow.yaml
      - .speakeasy/gen.yaml
      - .speakeasy/speakeasy-modifications-overlay.yaml
      - .speakeasy/terraform-entities-overlay.yaml
      - .speakeasy/patches/**

concurrency:
  group: speakeasy-generate
  cancel-in-progress: false

jobs:
  generate:
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    uses: speakeasy-api/sdk-generation-action/.github/workflows/workflow-executor.yaml@v15
    with:
      runs-on: ubuntu-latest
      force: ${{ github.event.inputs.force }}
      mode: pr
      set_version: ${{ github.event.inputs.set_version }}
    secrets:
      github_access_token: ${{ secrets.GITHUB_TOKEN }}
      speakeasy_api_key: ${{ secrets.SPEAKEASY_API_KEY }}

  auto-merge:
    needs: generate
    if: ${{ !cancelled() && needs.generate.result == 'success' }}
    uses: ./.github/workflows/auto-merge-speakeasy-pr.yaml
    secrets:
      GH_DOCS_SYNC_APP_ID: ${{ secrets.GH_DOCS_SYNC_APP_ID }}
      GH_DOCS_SYNC_APP_PRIVATE_KEY: ${{ secrets.GH_DOCS_SYNC_APP_PRIVATE_KEY }}
