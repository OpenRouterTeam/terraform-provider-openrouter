name: Auto-merge Speakeasy PR

# Called after Speakeasy Generate (mode: pr). Merges the open regen PR so
# sdk_publish.yaml can run. The action reuses an open regen PR rather than
# opening a second one, so the newest open speakeasy-sdk-regen-* PR is the one
# this run created or updated (its branch_name is a job output that the
# reusable workflow does not expose); any older ones are closed.
#
# Uses the GH_DOCS_SYNC app token (not GITHUB_TOKEN) so the merge triggers
# downstream push workflows. The app must be a bypass actor on the main
# rulesets (repo and org) for the merge to land without a human approval.

on:
  workflow_call:
    secrets:
      GH_DOCS_SYNC_APP_ID:
        required: true
      GH_DOCS_SYNC_APP_PRIVATE_KEY:
        required: true

permissions:
  contents: read

concurrency:
  group: auto-merge-speakeasy
  cancel-in-progress: false

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.GH_DOCS_SYNC_APP_ID }}
          private-key: ${{ secrets.GH_DOCS_SYNC_APP_PRIVATE_KEY }}

      - name: Merge the regen PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          REGEN_PRS=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --search "head:speakeasy-sdk-regen-" \
            --json number,headRefName,headRefOid,updatedAt \
            --jq '[.[] | select(.headRefName | startswith("speakeasy-sdk-regen-"))] | sort_by(.updatedAt) | reverse')
          if [ "$(jq length <<< "$REGEN_PRS")" = 0 ]; then
            echo "No open Speakeasy regen PR; nothing to merge"
            exit 0
          fi
          PR=$(jq -r '.[0].number' <<< "$REGEN_PRS")
          SHA=$(jq -r '.[0].headRefOid' <<< "$REGEN_PRS")
          BRANCH=$(jq -r '.[0].headRefName' <<< "$REGEN_PRS")
          jq -r '.[1:][].number' <<< "$REGEN_PRS" \
            | xargs -r -I{} gh pr close {} --repo "$GITHUB_REPOSITORY" --delete-branch \
                --comment "Superseded by Speakeasy SDK generation PR #$PR"

          # The REST merge honors the app's ruleset bypass; GitHub auto-merge
          # never does. Regen PRs are opened with GITHUB_TOKEN, so no PR checks
          # run on them: the push-to-main CI run and the sdk_publish.yaml
          # acceptance gate validate them.
          if gh api -X PUT "repos/$GITHUB_REPOSITORY/pulls/$PR/merge" \
              -f merge_method=squash -f sha="$SHA" > /dev/null; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH" > /dev/null \
              || echo "::warning::Merged PR #$PR but could not delete $BRANCH"
            echo "::notice title=auto-merge-pr::Merged Speakeasy PR #$PR"
          else
            # Without the bypass, queue auto-merge so one approval lands it.
            gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash --auto --delete-branch
            echo "::warning title=auto-merge-waiting::PR #$PR needs an approval: the GH_DOCS_SYNC app cannot bypass the main ruleset"
          fi
