# Pinned copy of the /private-endpoints API (openrouter-web #47521 at
# 8223a225: Idempotency-Key on create, 408 on every operation), applied on top
# of the monorepo-synced .speakeasy/in.openapi.yaml.
#
# The sdk-bot spec sync rewrites in.openapi.yaml wholesale, and the public spec
# it copies still hides these routes until #47521 ships. Keeping them here means
# a sync cannot drop the openrouter_private_endpoint resource. Every action
# removes whatever the synced spec has for a path or schema before adding the
# pinned copy, so the result is identical whether or not the sync already
# carries the routes.
#
# Delete this file (and its workflow.yaml entry) once the synced spec carries
# the routes with this shape. The shared error schemas it references
# (BadRequestResponse, RequestTimeoutResponse, ...) come from in.openapi.yaml.
