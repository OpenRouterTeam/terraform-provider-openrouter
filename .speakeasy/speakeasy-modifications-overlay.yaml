# Provider custom code (see CONTRIBUTING.md): internal/provider/provider.go carries the
# workload identity federation schema attributes (oidc_token, oidc_token_file,
# federation_policy_id) and their Configure hook. They stay as persistent edits because the
# spec does not model provider attributes. Editing this file is what makes regenerate.yaml
# run on a PR that changes that generated code.
#
# internal/provider/guardrail_resource.go and internal/provider/guardrail_data_source.go read a
# guardrail through a retrying helper in guardrail_read_lag.go, and the resource's Delete polls
# until the row reads as gone, because the API can answer 404 for a read issued moments after the
# write that created the row, and 200 for a read moments after the delete. The spec cannot express
# that tolerance, so both call sites stay as persistent edits, and this comment is the declaration
# that makes regenerate.yaml run on the PR that changes them.
#
# internal/provider/workspacedefaultguardrail_resource.go is hand-written and registered through
# terraform.additionalResources in gen.yaml, so generation never writes it. Its ImportState resolves
# the import identifier through GET /workspaces/{id}, which accepts a UUID or a slug, and stores the
# canonical UUID; a generated resource would keep whatever the import string contained, which leaves
# a slug in an identifier attribute. This comment is the declaration that makes regenerate.yaml run
# on the PR that changes that file, and a regenerated commit should show no diff for it.
#
# internal/provider/guardrailpolicybudget_resource.go drops Computed from the limit_usd and
# reset_interval attributes of the config object. The spec marks both nullable and required, so
# generation emits Optional+Computed, and a removed attribute then arrives unknown in the plan:
# merge keeps the stored value and the update re-sends the cap the caller meant to clear, while the
# route needs both fields present with null meaning unset. Optional without Computed plans null,
# which the request builder already renders as that explicit null.
# internal/provider/workspacedefaultguardrail_resource.go uses the same shape for its clearable
# attributes.
#
# internal/provider/guardrailpolicymoderation_resource.go drops Computed from the armor attribute of
# its config object for the same reason, and armor is the one field in that config whose only clear
# gesture is removal: the builder omits a nil armor block, the route replaces the config wholesale,
# and a live probe of the route confirmed the stored block is gone afterwards. The rest of the
# config is scalars and lists, which have their own clear gestures (false, []) and keep the
# generated Optional+Computed. A regenerated commit should show no diff for either file.
#
# ImportState in the three generated guardrail policy resources resolves the import identifier
# through guardrailPolicyImportID in internal/provider/guardrail_policy_import.go: a policy read
# needs a workspace scope, the API never returns one, so the import identifier is the only channel
# that can carry it, and generation would restore a bare req.ID. This comment is the declaration
# that makes regenerate.yaml run on the PR that changes those files.
overlay: 1.0.0
x-speakeasy-jsonpath: rfc9535
info:
  title: Speakeasy Modifications
  version: 0.0.3
  x-speakeasy-metadata:
    after: ""
    before: ""
    type: speakeasy-modifications
# Persistent edits in privateendpoint_resource.go filter PATCH to changed mutable
# groups, omit draft-only fields, settle computed state through a full GET, and
# restore declared parameters that validation has since proven so the read model's
# filtered projection does not turn into a permanent diff.
# Comparison helpers live in privateendpoint_lifecycle.go; generation must retain
# their Update(), Create() and Read() call sites rather than restore a
# pricing-only write gate.
