configVersion: 2.0.0
generation:
  sdkClassName: OpenRouter
  maintainOpenAPIOrder: true
  usageSnippets:
    optionalPropertyRendering: withExample
    sdkInitStyle: constructor
  useClassNamesForArrayFields: true
  fixes:
    nameResolutionDec2023: true
    nameResolutionFeb2025: true
    parameterOrderingFeb2024: true
    requestResponseComponentNamesFeb2024: true
    securityFeb2025: true
    sharedErrorComponentsApr2025: true
    sharedNestedComponentsJan2026: true
    nameOverrideFeb2026: true
    openSingleValueEnumsOct2026: false
  auth:
    oAuth2ClientCredentialsEnabled: true
    oAuth2PasswordEnabled: true
    hoistGlobalSecurity: true
  inferSSEOverload: true
  sdkHooksConfigAccess: true
  schemas:
    allOfMergeStrategy: shallowMerge
  requestBodyFieldName: body
  versioningStrategy: automatic
  persistentEdits:
    enabled: "true"
# Custom code lives in a handful of generated files. Each one is a small
# hand edit that regeneration merges back in, and each is guarded by a test
# that fails if the edit disappears:
#   internal/provider/scimgroupmapping_resource_sdk.go  -> keep_members on DELETE
#     (internal/acceptance/scim_group_mapping_stub_test.go)
# Keep the edits few and the logic in a hand-written file next to the package.
  tests:
    generateTests: false
    generateNewTests: true
    skipResponseBodyAssertions: false
terraform:
  version: 0.3.128
  additionalActions: []
  additionalDataSources: []
  additionalDependencies:
    github.com/hashicorp/go-cleanhttp: v0.5.2
    github.com/hashicorp/terraform-plugin-testing: v1.16.0
  additionalEphemeralResources: []
  additionalFunctions: []
  additionalListResources: []
  additionalProviderAttributes:
    httpHeaders: ""
    tlsSkipVerify: ""
  additionalResources:
    - resource: NewGuardrailMemberAssignmentResource
    - resource: NewWorkspaceDefaultGuardrailResource
    - resource: NewWorkspaceMemberResource
    - resource: NewGuardrailKeyAssignmentResource
  author: OpenRouterTeam
  baseErrorName: OpenRouterError
  debugLogging: {}
  defaultErrorName: APIError
  enableCustomCodeRegions: false
  enableOperationSecurity: false
  enableOperationServers: false
  enableTypeDeduplication: false
  environmentVariables:
    - env: OPENROUTER_MANAGEMENT_KEY
      providerAttribute: api_key
  excludeEmptyObjectSchemas: true
  fixFlags:
    encodePathParams: false
  forwardCompatibleEnumsByDefault: false
  includeEmptyObjects: true
  inferUnionDiscriminators: true
  packageName: openrouter
  preApplyUnionDiscriminators: true
  providerTypeNameOverride: ""
  respectRequiredFields: false
  respectTitlesForPrimitiveUnionMembers: true
  serverVariableProviderAttributes: {}
  unionStrategy: populated-fields
