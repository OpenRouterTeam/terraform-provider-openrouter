          name:
            description: Provider name, shown in your activity, logs and Broadcast output. 2-64 letters, numbers, spaces, dots, underscores or hyphens. Cannot be changed later. Neither the name nor its slug may match an existing provider name or slug (case-insensitive).
            example: WCIE
            type: string
          privacy_policy_url:
            example: https://example.com/privacy
            type:
              - string
              - "null"
          slug:
            description: "Derived from the name: lowercased, with every run of other characters replaced by a hyphen (`Acme Inference` becomes `acme-inference`). Use it as `provider_slug` when creating private endpoints and BYOK keys."
            example: wcie
            type: string
        required:
          - name
          - slug
          - display_name
          - base_url
          - privacy_policy_url
          - headquarters
          - datacenters
          - data_policy
          - created_at
        type: object
      PrivateProviderDataPolicy:
        description: Your own declaration of how the provider handles data. It applies to your own traffic; OpenRouter does not verify it.
        example:
          prompt_retention_days: null
          retains_prompts: false
          training: false
        properties:
          prompt_retention_days:
