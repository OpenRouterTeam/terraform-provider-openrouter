  - target: $["components"]["schemas"]
    update:
      CreatePrivateProviderRequest:
        properties:
          base_url:
            description: HTTPS base URL of an OpenAI-compatible API. Private endpoints under this provider use it unless they set their own. Private, internal, metadata and OpenRouter hosts are rejected.
            example: https://inference.example.com/v1
            type: string
          data_policy:
            $ref: "#/components/schemas/PrivateProviderDataPolicy"
          datacenters:
            description: ISO 3166-1 alpha-2 country codes of the datacenters serving requests.
            example:
              - US
            items:
              type: string
            type: array
          display_name:
            example: WCIE
            type: string
          headquarters:
            description: ISO 3166-1 alpha-2 country code.
            example: US
            type:
              - string
              - "null"
          name:
            description: Provider name, shown in your activity, logs and Broadcast output. 2-64 letters, numbers, spaces, dots, underscores or hyphens. Cannot be changed later. Neither the name nor its slug may match an existing provider name or slug (case-insensitive).
            example: WCIE
            type: string
          privacy_policy_url:
            example: https://example.com/privacy
            type:
              - string
              - "null"
        required:
          - name
          - display_name
          - base_url
          - data_policy
        type: object
      PrivateProvider:
        example:
          base_url: https://inference.example.com/v1
          created_at: 2026-10-06T12:00:00.000Z
          data_policy:
            prompt_retention_days: null
            retains_prompts: false
            training: false
          datacenters:
            - US
          display_name: WCIE
          headquarters: US
          name: WCIE
          privacy_policy_url: https://example.com/privacy
          slug: wcie
        properties:
          base_url:
            description: HTTPS base URL of an OpenAI-compatible API. Private endpoints under this provider use it unless they set their own. Private, internal, metadata and OpenRouter hosts are rejected.
            example: https://inference.example.com/v1
            type:
              - string
              - "null"
          created_at:
            type: string
          data_policy:
            description: Your declared data policy, or `null` when none was declared.
            properties:
              prompt_retention_days:
                description: Days prompts are retained. Must be `null` unless `retains_prompts` is true.
                type:
                  - integer
                  - "null"
              retains_prompts:
                description: Whether the provider retains prompts or completions.
                type: boolean
              training:
                description: Whether the provider trains on prompts.
                type: boolean
            required:
              - training
              - retains_prompts
              - prompt_retention_days
            type:
              - object
              - "null"
          datacenters:
            description: ISO 3166-1 alpha-2 country codes of the datacenters serving requests.
            example:
