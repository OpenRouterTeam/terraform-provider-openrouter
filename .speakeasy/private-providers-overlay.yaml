# Pinned copy of the /private-providers API (openrouter-web #49419), applied
# on top of the monorepo-synced .speakeasy/in.openapi.yaml.
#
# #49419 marks the routes `hide: true`, so the synced public spec leaves them
# out until private providers launch. Keeping them here lets the
# openrouter_private_provider resource build before then.
# Every action removes whatever the synced spec has for a path or schema
# before adding the pinned copy, so the result is identical whether or not
# the sync already carries the routes.
#
# Delete this file (and its workflow.yaml entry) once the synced spec carries
# the routes with this shape. The shared error schemas it references
# (BadRequestResponse, RequestTimeoutResponse, ...) come from in.openapi.yaml.
